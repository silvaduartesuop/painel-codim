<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log de atualização - CODIM</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --txt: #1d2330; --muted: #5d6675; --line: #dfe3ea;
    --ok: #16794a; --ok-bg: #e6f5ec; --err: #b42318; --err-bg: #fdecea;
    --warn: #9a6700; --warn-bg: #fff4d6; --info: #3b5b8a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1c2129; --txt: #e6e9ef; --muted: #9aa3b2; --line: #2c333d;
      --ok: #5fd39a; --ok-bg: #163324; --err: #ff8a80; --err-bg: #3a1c1a;
      --warn: #f3c969; --warn-bg: #3a2f12; --info: #8fb3e8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1c2129; --txt: #e6e9ef; --muted: #9aa3b2; --line: #2c333d;
    --ok: #5fd39a; --ok-bg: #163324; --err: #ff8a80; --err-bg: #3a1c1a;
    --warn: #f3c969; --warn-bg: #3a2f12; --info: #8fb3e8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .aviso { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; background: var(--warn-bg); color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 14px; }
  .cab { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .ok { color: var(--ok); background: var(--ok-bg); }
  .erro { color: var(--err); background: var(--err-bg); }
  .parcial { color: var(--warn); background: var(--warn-bg); }
  .andamento { color: var(--info); background: var(--warn-bg); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  details summary { cursor: pointer; color: var(--info); }
  details ul { margin: 6px 0 0 18px; padding: 0; color: var(--muted); }
  .vazio { color: var(--muted); padding: 24px 0; text-align: center; }
  @media (max-width: 600px) {
    th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Log de atualização - Consultas Discoverer</h1>
  <div class="sub" id="atualizado">Carregando...</div>
  <div id="alerta"></div>
  <div id="conteudo"></div>
</main>
<script>
(function () {
  var LIMITE_HORAS = 26;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtData(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric",
                                       hour: "2-digit", minute: "2-digit" });
  }

  function badge(status) {
    var cls = { "ok": "ok", "erro": "erro", "parcial": "parcial" }[status] || "andamento";
    var txt = { "ok": "OK", "erro": "Erro", "parcial": "Parcial", "em andamento": "Em andamento" }[status] || status;
    return '<span class="badge ' + cls + '">' + esc(txt) + '</span>';
  }

  function render(dados) {
    var exec = (dados && dados.execucoes) || [];
    document.getElementById("atualizado").textContent =
      "Arquivo gerado em " + fmtData(dados && dados.atualizado_em);

    var alerta = document.getElementById("alerta");
    alerta.innerHTML = "";
    if (exec.length) {
      var ultima = exec[0];
      var ref = ultima.fim || ultima.inicio;
      var horas = (Date.now() - new Date(ref).getTime()) / 3600000;
      if (ultima.status === "em andamento") {
        alerta.innerHTML = '<div class="aviso">Uma execução está em andamento (iniciada em ' + fmtData(ultima.inicio) + ').</div>';
      } else if (horas > LIMITE_HORAS) {
        alerta.innerHTML = '<div class="aviso">Última execução há mais de ' + LIMITE_HORAS + ' horas. Verifique o agendamento.</div>';
      } else if (ultima.status !== "ok") {
        alerta.innerHTML = '<div class="aviso">Última execução com problemas. Veja os detalhes abaixo.</div>';
      }
    }

    var c = document.getElementById("conteudo");
    if (!exec.length) {
      c.innerHTML = '<div class="vazio">Nenhuma execução registrada ainda.</div>';
      return;
    }

    c.innerHTML = exec.map(function (e) {
      var itens = (e.itens || []).map(function (i) {
        var msgs = (i.mensagens || []).map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("");
        var arq = i.xls ? '<div class="mono">' + esc(i.xls) + '</div>' : "";
        if (i.copia_diaria) arq += '<div class="mono">' + esc(i.copia_diaria) + '</div>';
        return '<tr>' +
          '<td>' + badge(i.status) + '</td>' +
          '<td><strong>' + esc(i.consulta) + '</strong><div class="mono">' + esc(i.pasta) + '</div></td>' +
          '<td>' + arq + (i.tamanho_kb != null ? '<div>' + esc(i.tamanho_kb) + ' KB</div>' : "") + '</td>' +
          '<td>' + (i.duracao_s != null ? esc(i.duracao_s) + ' s' : "-") +
            (msgs ? '<details><summary>Detalhes</summary><ul>' + msgs + '</ul></details>' : "") + '</td>' +
          '</tr>';
      }).join("");
      return '<section class="card">' +
        '<div class="cab"><div><strong>' + fmtData(e.inicio) + '</strong>' +
        ' <span class="sub">até ' + fmtData(e.fim) + '</span></div>' + badge(e.status) + '</div>' +
        '<table><thead><tr><th>Status</th><th>Consulta</th><th>Arquivo</th><th>Tempo</th></tr></thead>' +
        '<tbody>' + itens + '</tbody></table></section>';
    }).join("");
  }

  fetch("log_exportacao.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(function (err) {
      document.getElementById("atualizado").textContent = "Não foi possível carregar o log.";
      document.getElementById("conteudo").innerHTML =
        '<div class="aviso">Erro ao ler log_exportacao.json: ' + esc(err.message) + '</div>';
    });
})();
</script>
</body>
</html>
